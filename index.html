<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat AI Roleplay</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="judul"><i class="fa fa-comments-o"></i> Chat AI Roleplay</h1>
            <button id="btnPengaturan" class="btn-pengaturan">
                <i class="fa fa-cog"></i>
            </button>
        </div>
    </header>

    <main class="container utama">
        <!-- Panel Pengaturan -->
        <div id="panelPengaturan" class="panel pengaturan tersembunyi">
            <h2>🎭 Pengaturan Karakter</h2>
            <div class="form-grup">
                <label>Nama Karakter</label>
                <input type="text" id="namaKarakter" value="Lia">
            </div>
            <div class="form-grup">
                <label>Peran / Hubungan</label>
                <select id="jenisPeran">
                    <option value="pacar" selected>Pacar / Kekasih yang sayang dan perhatian</option>
                    <option value="teman">Teman akrab yang asyik dan pengertian</option>
                    <option value="sahabat">Sahabat setia yang selalu ada buat kamu</option>
                </select>
            </div>
            <div class="form-grup">
                <label>Sifat & Gaya Bicara</label>
                <textarea id="sifatKarakter" rows="2">Ramah, lembut, suka bercanda, selalu perhatikan perasaanmu, bicara santai dan akrab, gunakan bahasa Indonesia sehari-hari yang natural</textarea>
            </div>
            <button id="simpanPengaturan" class="btn-utama">Simpan & Mulai</button>
        </div>

        <!-- Kotak Obrolan -->
        <div class="kotak-obrolan">
            <div class="baris-atas">
                <div class="avatar"><i class="fa fa-user-circle-o"></i></div>
                <div>
                    <h3 id="namaTampil">Lia</h3>
                    <p id="statusModel">Siap — Langsung ngobrol saja ✅</p>
                </div>
            </div>

            <div id="areaPesan" class="area-pesan">
                <div class="pesan ai">
                    <div class="ikon"><i class="fa fa-user"></i></div>
                    <div class="bubble">Hai! 😊 Aku siap ngobrol sama kamu. Cerita apa aja boleh ya, aku dengerin baik-baik~</div>
                </div>
            </div>

            <div class="kolom-kirim">
                <form id="formKirim" class="form-kirim">
                    <input type="text" id="inputPesan" placeholder="Ketik pesanmu disini..." required>
                    <button type="submit" class="btn-kirim"><i class="fa fa-paper-plane"></i></button>
                </form>
            </div>
        </div>
    </main>

    <script>
        let currentModelIndex = 0;
        let conversationHistory = [];
        let pengaturan = {
            nama: "Lia",
            peran: "pacar",
            sifat: "Ramah, lembut, suka bercanda, selalu perhatikan perasaanmu, bicara santai dan akrab"
        };

        // Simpan & ambil otomatis
        function simpanKePenyimpanan() {
            localStorage.setItem('ai_chat_settings', JSON.stringify(pengaturan));
        }
        function ambilDariPenyimpanan() {
            const data = localStorage.getItem('ai_chat_settings');
            if (data) {
                try {
                    const d = JSON.parse(data);
                    pengaturan = {...pengaturan, ...d};
                    document.getElementById('namaKarakter').value = pengaturan.nama;
                    document.getElementById('jenisPeran').value = pengaturan.peran;
                    document.getElementById('sifatKarakter').value = pengaturan.sifat;
                    document.getElementById('namaTampil').textContent = pengaturan.nama;
                }catch(e){}
            }
        }
        ambilDariPenyimpanan();

        // Tampil/sembunyi pengaturan
        document.getElementById('btnPengaturan').addEventListener('click', () => {
            document.getElementById('panelPengaturan').classList.toggle('tersembunyi');
        });

        // Simpan pengaturan
        document.getElementById('simpanPengaturan').addEventListener('click', () => {
            pengaturan.nama = document.getElementById('namaKarakter').value || "Lia";
            pengaturan.peran = document.getElementById('jenisPeran').value;
            pengaturan.sifat = document.getElementById('sifatKarakter').value;
            document.getElementById('namaTampil').textContent = pengaturan.nama;
            document.getElementById('panelPengaturan').classList.add('tersembunyi');
            conversationHistory = [];
            simpanKePenyimpanan();
        });

        // Tambah pesan ke layar
        function tambahPesan(teks, tipe="pengguna"){
            const div = document.createElement('div');
            div.className = `pesan ${tipe === "pengguna" ? "kamu" : "ai"}`;
            div.innerHTML = `
                <div class="ikon"><i class="fa fa-user"></i></div>
                <div class="bubble">${teks}</div>
            `;
            document.getElementById('areaPesan').appendChild(div);
            document.getElementById('areaPesan').scrollTop = document.getElementById('areaPesan').scrollHeight;
        }

        // Panggil server
        async function panggilAI(pesan){
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    pesan: pesan,
                    riwayat: conversationHistory,
                    model_index: currentModelIndex,
                    nama: pengaturan.nama,
                    peran: pengaturan.peran,
                    sifat: pengaturan.sifat
                })
            });
            const data = await res.json();
            if(data.model_index !== undefined) currentModelIndex = data.model_index;
            return data.jawaban;
        }

        // Kirim pesan
        document.getElementById('formKirim').addEventListener('submit', async e => {
            e.preventDefault();
            const input = document.getElementById('inputPesan');
            const teks = input.value.trim();
            if(!teks) return;

            tambahPesan(teks, "pengguna");
            input.value = "";

            // Tampil menunggu
            const menunggu = document.createElement('div');
            menunggu.className = "pesan ai";
            menunggu.innerHTML = `<div class="ikon"><i class="fa fa-user"></i></div><div class="bubble text-abu"><i class="fa fa-circle-o-notch fa-spin"></i> Sedang mengetik...</div>`;
            document.getElementById('areaPesan').appendChild(menunggu);
            document.getElementById('areaPesan').scrollTop = document.getElementById('areaPesan').scrollHeight;

            const jawab = await panggilAI(teks);
            menunggu.remove();
            tambahPesan(jawab, "ai");
            conversationHistory.push({role:"user", content:teks}, {role:"assistant", content:jawab});
        });
    </script>
</body>
</html>
