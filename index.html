<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoleksiPlay - Platform Game 18+</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --bg: #18191a; --card: #242526; --text: #e4e6eb; --text-m: #b0b3b8; --accent: #ff2a5f; --input: #3a3b3c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg); color: var(--text); }
        nav { background: #1f2021; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2e2f; position: sticky; top: 0; z-index: 100; }
        nav .logo { font-size: 1.3rem; font-weight: bold; color: var(--accent); text-decoration: none; }
        .btn { padding: 8px 14px; border-radius: 4px; font-weight: 600; cursor: pointer; border: none; font-size: 0.8rem; margin-left: 5px; }
        .btn-p { background-color: var(--accent); color: white; }
        .btn-s { background-color: var(--input); color: var(--text); }
        .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
        .title { font-size: 1.3rem; margin-bottom: 20px; border-left: 4px solid var(--accent); padding-left: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .img-c { width: 100%; height: 240px; background: #111; }
        .img-c img { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 10px; }
        .g-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .tag { display: inline-block; font-size: 0.65rem; background: var(--input); color: var(--text-m); padding: 2px 5px; border-radius: 3px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-c { background: var(--card); padding: 20px; border-radius: 8px; max-width: 450px; width: 100%; }
        .modal-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close { font-size: 1.4rem; cursor: pointer; color: var(--text-m); }
        .f-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        .f-group label { font-size: 0.8rem; color: var(--text-m); margin-bottom: 4px; }
        .f-group input { background: var(--input); border: 1px solid #4e4f50; color: var(--text); padding: 8px; border-radius: 4px; outline: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8rem; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--input); }
        .a-btn { padding: 3px 6px; border-radius: 3px; cursor: pointer; border: none; font-size: 0.7rem; color: white; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo" onclick="location.reload()">KoleksiPlay</a>
        <div>
            <button class="btn btn-s" onclick="openM('adminM')">Admin Panel</button>
            <span id="userNav">
                <button class="btn btn-s" onclick="openM('authM')">Daftar / Login</button>
            </span>
            <button class="btn btn-p" id="btnAddGame" onclick="openM('subM')" style="display: none;">+ Game</button>
        </div>
    </nav>

    <div class="container">
        <h2 class="title">Game Terverifikasi</h2>
        <div class="grid" id="pubGrid"></div>
    </div>

    <!-- MODAL 1: Login / Daftar Akun Pengunjung -->
    <div id="authM" class="modal">
        <div class="modal-c">
            <div class="modal-h"><h3 id="authTitle">Login Akun</h3><span class="close" onclick="closeM('authM')">&times;</span></div>
            <form id="fAuth">
                <div class="f-group"><label>Alamat Email</label><input type="email" id="authEmail" required></div>
                <div class="f-group"><label>Kata Sandi</label><input type="password" id="authPass" required></div>
                <button type="submit" id="btnAuthSubmit" class="btn btn-p" style="width:100%; padding:10px; margin-bottom: 10px;">Masuk</button>
                <p id="toggleAuth" style="font-size:0.8rem; color:var(--accent); text-align:center; cursor:pointer;">Belum punya akun? Daftar disini</p>
            </form>
        </div>
    </div>

        <!-- MODAL 2: Tambah Game -->
    <div id="subM" class="modal">
        <div class="modal-c">
            <div class="modal-h"><h3>Ajukan Game Baru</h3><span class="close" onclick="closeM('subM')">&times;</span></div>
            <form id="fSub">
                <div class="f-group"><label>Nama Game</label><input type="text" id="t" required></div>
                <div class="f-group"><label>Link Web Game</label><input type="url" id="gU" required></div>
                <div class="f-group"><label>Link URL Gambar Sampul</label><input type="url" id="iU" required></div>
                <button type="submit" class="btn btn-p" style="width:100%; padding:10px;">Kirim</button>
            </form>
        </div>
    </div>

    <!-- MODAL 3: Admin Dashboard -->
    <div id="adminM" class="modal">
        <div class="modal-c" style="max-width: 600px;">
            <div class="modal-h"><h3>Dashboard Admin</h3><span class="close" onclick="closeM('adminM')">&times;</span></div>
            <div id="fLog">
                <div class="f-group"><label>Sandi Rahasia Admin</label><input type="password" id="pAdmin"></div>
                <button class="btn btn-p" onclick="loginAdmin()" style="width:100%;">Masuk</button>
            </div>
            <div id="pAdminPanel" style="display: none; overflow-x: auto;">
                <table style="width: 100%;">
                    <thead><tr><th>Nama</th><th>Link</th><th>Aksi</th></tr></thead>
                    <tbody id="pList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const URL = "https://supabase.co";
        const KEY = "sb_publishable_LUnfSVgZM2zNpBxT7UCdRw_zAptyxaA";
        const ADMIN_PASS = "12345"; // Kata sandi rahasia untuk panel admin kamu

        const sb = supabase.createClient(URL, KEY);
        let isSignUpMode = false;

        function openM(id) { document.getElementById(id).style.display = 'flex'; }
        function closeM(id) { document.getElementById(id).style.display = 'none'; }

        async function checkUserSession() {
            const { data: { session } } = await sb.auth.getSession();
            const userNav = document.getElementById('userNav');
            const btnAddGame = document.getElementById('btnAddGame');

            if (session) {
                userNav.innerHTML = `<span style="font-size:0.8rem; color:var(--text-m); margin-right:5px;">${session.user.email}</span><button class="btn btn-s" onclick="logoutUser()">Logout</button>`;
                btnAddGame.style.display = 'inline-block';
            } else {
                userNav.innerHTML = `<button class="btn btn-s" onclick="openM('authM')">Daftar / Login</button>`;
                btnAddGame.style.display = 'none';
            }
        }

        document.getElementById('toggleAuth').addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').innerText = isSignUpMode ? "Daftar Akun Baru" : "Login Akun";
            document.getElementById('btnAuthSubmit').innerText = isSignUpMode ? "Daftar Sekarang" : "Masuk";
            document.getElementById('toggleAuth').innerText = isSignUpMode ? "Sudah punya akun? Login disini" : "Belum punya akun? Daftar disini";
        });

        document.getElementById('fAuth').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPass').value;

            if (isSignUpMode) {
                const { error } = await sb.auth.signUp({ email, password });
                if (error) alert("Pendaftaran Gagal: " + error.message);
                else alert("Pendaftaran sukses! Silakan coba masuk.");
            } else {
                const { error } = await sb.auth.signInWithPassword({ email, password });
                if (error) alert("Login Gagal! Cek email & password.");
                else { closeM('authM'); checkUserSession(); }
            }
        });

        async function logoutUser() {
            await sb.auth.signOut();
            checkUserSession();
        }

        async function loadPublicGames() {
            const g = document.getElementById('pubGrid');
            g.innerHTML = '<div>Memuat...</div>';
            const { data } = await sb.from('games').select('*').eq('status', 'approved').order('created_at', { ascending: false });
            g.innerHTML = data && data.length ? '' : '<div>Belum ada game terverifikasi.</div>';
            if(data) data.forEach(x => {
                g.innerHTML += `<a href="${x.game_url}" target="_blank" class="card">
                    <div class="img-c"><img src="${x.image_url}" onerror="this.src='https://placehold.co'"></div>
                    <div class="info"><div class="g-title">${x.title}</div><div class="tag">18+ Sim</div></div>
                </a>`;
            });
        }

        document.getElementById('fSub').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data: { session } } = await sb.auth.getSession();
            const submitter = session ? session.user.email : 'anonymous';

            const { error } = await sb.from('games').insert([{ 
                title: document.getElementById('t').value, 
                game_url: document.getElementById('gU').value, 
                image_url: document.getElementById('iU').value, 
                status: 'pending',
                submitted_by: submitter
            }]);
            
            if (error) alert("Gagal mengajukan!");
            else { alert("Sukses! Menunggu persetujuan admin."); document.getElementById('fSub').reset(); closeM('subM'); }
        });

        function loginAdmin() {
            if (document.getElementById('pAdmin').value === ADMIN_PASS) {
                document.getElementById('fLog').style.display = 'none';
                document.getElementById('pAdminPanel').style.display = 'block';
                loadPend();
            } else alert("Sandi Admin Salah!");
        }

        async function loadPend() {
            const b = document.getElementById('pList');
            b.innerHTML = '<tr><td colspan="3">Memuat...</td></tr>';
            const { data } = await sb.from('games').select('*').eq('status', 'pending');
            b.innerHTML = data && data.length ? '' : '<tr><td colspan="3">Tidak ada pengajuan.</td></tr>';
            if(data) data.forEach(x => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${x.title} <br><small style="color:gray;">Oleh: ${x.submitted_by || 'Anonim'}</small></td>
                    <td><a href="${x.game_url}" target="_blank">Cek</a></td>
                    <td><button class="a-btn" style="background:#28a745" onclick="up(${x.id})">Terima</button>
                    <button class="a-btn" style="background:#dc3545" onclick="del(${x.id})">Tolak</button></td>`;
                b.appendChild(tr);
            });
        }

        async function up(id) { await sb.from('games').update({ status: 'approved' }).eq('id', id); loadPend(); loadPublicGames(); }
        async function del(id) { if(confirm("Hapus?")) { await sb.from('games').delete().eq('id', id); loadPend(); } }
        
        checkUserSession();
        loadPublicGames();
    </script>
</body>
</html>
