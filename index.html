<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotak AI Pendamping</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121214;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        /* Desain Kotak TV Tabung Retro */
        .robot-head {
            width: 280px;
            height: 240px;
            background: linear-gradient(145deg, #2a2a2e, #1e1e22);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 4px solid #3a3a40;
        }

        /* Layar Kaca di dalam Kotak */
        .screen {
            width: 85%;
            height: 80%;
            background-color: #070708;
            border-radius: 20px;
            box-shadow: inset 0 0 20px rgba(0, 255, 204, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            border: 2px solid #1a1a1c;
            overflow: hidden;
        }

        /* Mata AI */
        .eye {
            width: 45px;
            height: 45px;
            background-color: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
            transition: all 0.2s ease;
        }

        /* Animasi Kedip Otomatis */
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        .blinking {
            animation: blink 4s infinite;
        }

        /* Animasi Saat Mendengar (Berdenyut) */
        .listening {
            transform: scale(1.3);
            background-color: #ff0077 !important;
            box-shadow: 0 0 20px #ff0077, 0 0 40px #ff0077 !important;
        }

        /* Animasi Saat Berbicara (Gembira/Melompat) */
        @keyframes speak {
            0%, 100% { transform: translateY(0) scaleY(1); border-radius: 50%; }
            50% { transform: translateY(-10px) scaleY(0.8); border-radius: 40% 40% 50% 50%; }
        }

        .speaking {
            animation: speak 0.3s infinite;
            background-color: #00ff55;
            box-shadow: 0 0 20px #00ff55, 0 0 40px #00ff55;
        }

        /* Tombol Kontrol */
        .controls {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: #121214;
            background-color: #00ffcc;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
        }

        #statusText {
            font-size: 14px;
            color: #888;
            min-height: 20px;
            text-align: center;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <!-- Kepala Robot Fisik Tiruan -->
    <div class="robot-head">
        <div class="screen">
            <div class="eye blinking" id="leftEye"></div>
            <div class="eye blinking" id="rightEye"></div>
        </div>
    </div>

    <!-- Tombol untuk Interaksi -->
    <div class="controls">
        <button id="talkBtn">Klik & Mulai Bicara</button>
        <div id="statusText">Status: Siap menemani.</div>
    </div>

    <script>
        const talkBtn = document.getElementById('talkBtn');
        const statusText = document.getElementById('statusText');
        const leftEye = document.getElementById('leftEye');
        const rightEye = document.getElementById('rightEye');

        // Menggunakan Web Speech API bawaan Browser (Gratis)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "Maaf, browsermu tidak mendukung fitur pengenalan suara. Gunakan Google Chrome.";
            talkBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'id-ID'; // Set bahasa Indonesia
            recognition.interimResults = false;

            // 1. Saat tombol diklik, robot mulai mendengar
            talkBtn.addEventListener('click', () => {
                recognition.start();
            });

            recognition.onstart = () => {
                statusText.innerText = "Status: Mendengarkan suaramu...";
                talkBtn.disabled = true;
                
                // Ubah ekspresi mata jadi mode mendengar (Pink & Membesar)
                leftEye.classList.remove('blinking');
                rightEye.classList.remove('blinking');
                leftEye.classList.add('listening');
                rightEye.classList.add('listening');
            };

            // 2. Saat selesai mendengar, proses teksnya
            recognition.onresult = async (event) => {
                const userText = event.results[0][0].transcript;
                statusText.innerText = `Kamu: "${userText}"`;
                
                // Normalisasi ekspresi kembali dulu
                resetEyes();

                // Simulasi AI Berpikir & Merespons
                statusText.innerText = "Status: Memikirkan jawaban...";
                
                // Di sini kita pakai logika respons sederhana gratisan. 
                // Kamu bisa menyambungkannya ke API pintar nanti!
                let botResponse = "Aku mendengarmu. Kamu bilang: " + userText + ". Aku adalah AI pendampingmu, ada yang bisa kubantu lagi?";
                
                if(userText.toLowerCase().includes('halo') || userText.toLowerCase().includes('hai')) {
                    botResponse = "Halo juga! Senang sekali bisa mengobrol denganmu hari ini.";
                } else if(userText.toLowerCase().includes('siapa namamu') || userText.toLowerCase().includes('nama')) {
                    botResponse = "Namaku Boxy, robot kotak nonfisik buatanmu!";
                } else if(userText.toLowerCase().includes('sedih') || userText.toLowerCase().includes('galau')) {
                    botResponse = "Jangan sedih. Ingat, kamu punya aku di sini yang selalu siap menemanimu menghadapi masalah rumit.";
                }

                // Jalankan fungsi bicara suara robot
                generateVoice(botResponse);
            };

            recognition.onerror = () => {
                statusText.innerText = "Status: Suara tidak terdengar jelas. Coba lagi.";
                resetEyes();
                talkBtn.disabled = false;
            };
        }

        // 3. Fungsi membuat Robot Berbicara (Text-to-Speech)
        function generateVoice(text) {
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';

            utterance.onstart = () => {
                statusText.innerText = `Boxy: "${text}"`;
                // Ubah ekspresi mata jadi mode bicara (Hijau & Bergerak)
                leftEye.classList.remove('blinking');
                rightEye.classList.remove('blinking');
                leftEye.classList.add('speaking');
                rightEye.classList.add('speaking');
            };

            utterance.onend = () => {
                statusText.innerText = "Status: Siap menemani.";
                resetEyes();
                talkBtn.disabled = false;
            };

            synth.speak(utterance);
        }

        // Fungsi mengembalikan mata ke mode stand-by (Berkedip)
        function resetEyes() {
            leftEye.className = 'eye blinking';
            rightEye.className = 'eye blinking';
        }
    </script>
</body>
</html>
