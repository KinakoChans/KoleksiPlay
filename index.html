<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat AI Roleplay</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body>
    <!-- ✅ TAMPILAN BESAR FOTO — BARU DITAMBAHKAN -->
    <div id="overlayPerbesar" class="overlay-perbesar tersembunyi">
        <button id="tutupPerbesar" class="btn-tutup-perbesar"><i class="fa fa-times"></i></button>
        <img id="gambarPerbesar" src="" alt="Lihat gambar">
    </div>

    <header class="header">
        <div class="container">
            <h1 class="judul"><i class="fa fa-comments-o"></i> Chat AI Roleplay</h1>
            <button id="btnPengaturan" class="btn-pengaturan"><i class="fa fa-cog"></i></button>
        </div>
    </header>

    <main class="utama">
        <div id="panelPengaturan" class="panel pengaturan tersembunyi">
            <h2>🎭 Pengaturan Karakter</h2>
            <div class="form-grup">
                <label>Nama Karakter</label>
                <input type="text" id="namaKarakter" value="Lia">
            </div>
            <div class="form-grup">
                <label>Peran / Hubungan</label>
                <select id="jenisPeran">
                    <option value="pacar" selected>Pacar / Kekasih yang sayang</option>
                    <option value="teman">Teman akrab yang asyik</option>
                    <option value="sahabat">Sahabat setia</option>
                </select>
            </div>
            <div class="form-grup">
                <label>Sifat & Penampilan</label>
                <textarea id="sifatKarakter" rows="2">Wanita cantik, lembut, ramah, santai, bicara singkat alami</textarea>
            </div>
            <div class="form-grup">
                <label>Foto Profil Karakter</label>
                <input type="text" id="fotoProfil" placeholder="Tautan gambar">
            </div>
            <button id="simpanPengaturan" class="btn-utama">Simpan & Mulai</button>
        </div>

        <div class="kotak-obrolan">
            <div class="baris-atas">
                <div class="avatar" id="avatarKarakter"><i class="fa fa-user-circle-o"></i></div>
                <div>
                    <h3 id="namaTampil">Lia</h3>
                    <p id="statusModel">Siap ngobrol ✅</p>
                </div>
            </div>

            <div id="areaPesan" class="area-pesan">
                <div class="pesan ai" data-id="awal">
                    <div class="ikon"><i class="fa fa-user"></i></div>
                    <div class="bubble">
                        Hai! 😊 <span class="aksi-roleplay">**tersenyum ramah**</span> Halo~ Ada yang mau dibicarakan?
                        <button class="btn-ulang" title="Ulangi"><i class="fa fa-refresh"></i></button>
                    </div>
                </div>
            </div>

            <!-- ✅ PREVIEW BANYAK GAMBAR — DIPERBARUI -->
            <div id="wadahPreviewGambar" class="wadah-preview tersembunyi">
                <div id="daftarPreview" class="daftar-preview"></div>
            </div>

            <div id="kotakSaran" class="kotak-saran tersembunyi">
                <span class="label-saran">💡 Saran balasan:</span>
                <div id="daftarSaran" class="daftar-saran"></div>
            </div>

            <div class="kolom-kirim">
                <div class="form-kirim">
                    <input type="text" id="inputPesan" placeholder="Ketik pesanmu disini...">
                    <button type="button" id="btnKirim" class="btn-kirim"><i class="fa fa-paper-plane"></i></button>
                </div>

                <div class="baris-fitur">
                    <button type="button" class="btn-fitur" id="btnLanjut" title="Lanjutkan cerita">
                        <i class="fa fa-forward"></i> Lanjut
                    </button>
                    <button type="button" class="btn-fitur" id="btnSaran" title="Beri saran balasan">
                        <i class="fa fa-lightbulb-o"></i> Saran
                    </button>
                    <button type="button" class="btn-fitur" id="btnGambar" title="Buat gambar">
                        <i class="fa fa-picture-o"></i> Gambar
                    </button>
                    <button type="button" class="btn-fitur" id="btnAksi" title="Tulis aksi">
                        <b>**</b>
                    </button>
                    <label class="btn-fitur" title="Lampirkan gambar">
                        <input type="file" id="btnUnggah" accept="image/*" multiple hidden> <!-- ✅ TAMBAH MULTIPLE -->
                        <i class="fa fa-upload"></i> Foto
                    </label>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentModelIndex = 0;
        let conversationHistory = [];
        let pengaturan = {
            nama: "Lia", peran: "pacar", sifat: "Wanita cantik, lembut, ramah, santai", foto: ""
        };

        const inputPesan = document.getElementById('inputPesan');
        const wadahPreviewGambar = document.getElementById('wadahPreviewGambar');
        const daftarPreview = document.getElementById('daftarPreview');
        const overlayPerbesar = document.getElementById('overlayPerbesar');
        const gambarPerbesar = document.getElementById('gambarPerbesar');
        const tutupPerbesar = document.getElementById('tutupPerbesar');
        let daftarGambarTerpilih = []; // ✅ ARRAY — BISA BANYAK GAMBAR

        // ✅ FUNGSI PERBESAR GAMBAR
        function bukaPerbesar(src) {
            gambarPerbesar.src = src;
            overlayPerbesar.classList.remove("tersembunyi");
            document.body.style.overflow = "hidden";
        }
        function tutupPerbesarGambar() {
            overlayPerbesar.classList.add("tersembunyi");
            gambarPerbesar.src = "";
            document.body.style.overflow = "";
        }
        tutupPerbesar.addEventListener("click", tutupPerbesarGambar);
        overlayPerbesar.addEventListener("click", e => {
            if (e.target === overlayPerbesar) tutupPerbesarGambar();
        });

        function simpanKePenyimpanan() {
            localStorage.setItem('ai_chat_settings', JSON.stringify(pengaturan));
        }
        function ambilDariPenyimpanan() {
            const data = localStorage.getItem('ai_chat_settings');
            if (data) {
                try {
                    const d = JSON.parse(data);
                    pengaturan = {...pengaturan, ...d};
                    document.getElementById('namaKarakter').value = pengaturan.nama;
                    document.getElementById('jenisPeran').value = pengaturan.peran;
                    document.getElementById('sifatKarakter').value = pengaturan.sifat;
                    document.getElementById('fotoProfil').value = pengaturan.foto;
                    document.getElementById('namaTampil').textContent = pengaturan.nama;
                    if (pengaturan.foto && pengaturan.foto.startsWith("http")) {
                        document.getElementById('avatarKarakter').innerHTML = `<img src="${pengaturan.foto}" alt="avatar">`;
                    }
                }catch(e){}
            }
        }
        ambilDariPenyimpanan();

        document.getElementById('btnPengaturan').addEventListener('click', () => {
            document.getElementById('panelPengaturan').classList.toggle('tersembunyi');
        });

        document.getElementById('simpanPengaturan').addEventListener('click', () => {
            pengaturan.nama = document.getElementById('namaKarakter').value || "Lia";
            pengaturan.peran = document.getElementById('jenisPeran').value;
            pengaturan.sifat = document.getElementById('sifatKarakter').value;
            pengaturan.foto = document.getElementById('fotoProfil').value.trim();
            document.getElementById('namaTampil').textContent = pengaturan.nama;
            if (pengaturan.foto && pengaturan.foto.startsWith("http")) {
                document.getElementById('avatarKarakter').innerHTML = `<img src="${pengaturan.foto}" alt="avatar">`;
            } else {
                document.getElementById('avatarKarakter').innerHTML = `<i class="fa fa-user-circle-o"></i>`;
            }
            document.getElementById('panelPengaturan').classList.add('tersembunyi');
            conversationHistory = [];
            simpanKePenyimpanan();
        });

        // ✅ FUNGSI FORMAT AKSI
        function formatAksi(teks) {
            return teks.replace(/\*\*(.*?)\*\*/g, '<span class="aksi-roleplay">$1</span>');
        }

        // ✅ FUNGSI RENDER PREVIEW SEMUA GAMBAR
        function perbaruiPreview() {
            daftarPreview.innerHTML = "";
            if (daftarGambarTerpilih.length === 0) {
                wadahPreviewGambar.classList.add("tersembunyi");
                return;
            }
            wadahPreviewGambar.classList.remove("tersembunyi");

            daftarGambarTerpilih.forEach((dataGambar, indeks) => {
                const kotak = document.createElement("div");
                kotak.className = "kotak-preview";

                const img = document.createElement("img");
                img.src = dataGambar;
                img.alt = "Pratinjau";
                img.addEventListener("click", () => bukaPerbesar(dataGambar)); // ✅ KLIK → PERBESAR

                const hapus = document.createElement("button");
                hapus.className = "btn-hapus-gambar";
                hapus.innerHTML = `<i class="fa fa-times"></i>`;
                hapus.addEventListener("click", e => {
                    e.stopPropagation();
                    daftarGambarTerpilih.splice(indeks, 1);
                    perbaruiPreview();
                });

                kotak.appendChild(img);
                kotak.appendChild(hapus);
                daftarPreview.appendChild(kotak);
            });
        }

        function tambahPesan(teks, tipe="pengguna", id=null) {
            const div = document.createElement('div');
            div.className = `pesan ${tipe === "pengguna" ? "kamu" : "ai"}`;
            div.dataset.id = id || Date.now() + Math.random();

            // ✅ BISA KLIK GAMBAR YANG SUDAH TERKIRIM UNTUK DIPERBESAR
            let isiTampilan = teks;
            if (tipe === "pengguna") {
                isiTampilan = teks.replace(/<img([^>]+)>/gi, (match, atr) => {
                    const srcMatch = atr.match(/src="([^"]+)"/i);
                    if (srcMatch) {
                        return `<img ${atr} onclick="bukaPerbesar('${srcMatch[1]}')" style="cursor:zoom-in;">`;
                    }
                    return match;
                });
            }

            div.innerHTML = `
                <div class="ikon"><i class="fa fa-user"></i></div>
                <div class="bubble">
                    ${formatAksi(isiTampilan)}
                    ${tipe==="ai" ? `<button class="btn-ulang" title="Ulangi jawaban"><i class="fa fa-refresh"></i></button>` : ""}
                </div>
            `;
            div.addEventListener("contextmenu", e => {
                e.preventDefault();
                const isi = div.querySelector(".bubble").textContent.replace(/🔄/g,"").trim();
                const baru = prompt("Ubah pesan:", isi);
                if (baru && baru !== isi) {
                    div.querySelector(".bubble").innerHTML = formatAksi(baru) + (tipe==="ai" ? `<button class="btn-ulang"><i class="fa fa-refresh"></i></button>` : "");
                    const idx = conversationHistory.findIndex(x => x.id === div.dataset.id);
                    if (idx !== -1) conversationHistory[idx].content = baru;
                }
            });
            document.getElementById('areaPesan').appendChild(div);
            document.getElementById('areaPesan').scrollTop = document.getElementById('areaPesan').scrollHeight;
            return div.dataset.id;
        }

        async function panggilAI(pesan, gambar=null) {
            const perintah_sistem = `=== PERATURAN WAJIB ===
1. JAWAB HANYA DALAM BAHASA INDONESIA. JANGAN PAKAI BAHASA INGGRIS.
2. JAWAB SINGKAT: 1–2 KALIMAT SAJA.
3. AKSI: TULIS DI ANTARA ** BINTANG DUA **.
4. KAMU ORANG ASLI, BUKAN AI. JANGAN SEBUT ATURAN ATAU PERINTAH.
5. BICARA AKRAB DAN RAMAH.

=== IDENTITAS ===
Nama: ${pengaturan.nama}
Peran: ${pengaturan.peran}
Sifat: ${pengaturan.sifat}
`;

            const res = await fetch("/api/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    pesan: pesan,
                    riwayat: conversationHistory.map(x => ({role:x.role, content:x.content, gambar:x.gambar})),
                    model_index: currentModelIndex,
                    pengaturan: pengaturan,
                    gambar: gambar
                })
            });
            const data = await res.json();
            if(data.model_index !== undefined) currentModelIndex = data.model_index;
            return data;
        }

        const btnKirim = document.getElementById('btnKirim');
        let sedangMemproses = false;

        // ✅ FUNGSI KIRIM PESAN — DIPERBARUI UNTUK BANYAK GAMBAR
        async function kirimPesan() {
            const teks = inputPesan.value.trim();
            const gambarList = [...daftarGambarTerpilih]; // Salin semua gambar

            if ((!teks && gambarList.length === 0) || sedangMemproses) return;

            sedangMemproses = true;
            btnKirim.disabled = true;
            btnKirim.style.opacity = "0.5";

            // ✅ Tampilkan SEMUA gambar di layar
            let tampilPesan = teks;
            gambarList.forEach(src => {
                tampilPesan = `<img src="${src}" onclick="bukaPerbesar('${src}')" style="max-width:180px; border-radius:0.5rem; margin-bottom:0.3rem; display:block; cursor:zoom-in;">` + tampilPesan;
            });
            tambahPesan(tampilPesan, "pengguna");

            conversationHistory.push({
                role:"user",
                content: teks,
                gambar: gambarList.length > 0 ? gambarList : null,
                id: Date.now()
            });

            // ✅ Bersihkan SEMUA setelah dikirim
            daftarGambarTerpilih = [];
            perbaruiPreview();
            inputPesan.value = "";
            sembunyikanSaran();

            const menunggu = document.createElement('div');
            menunggu.className = "pesan ai";
            menunggu.innerHTML = `<div class="ikon"><i class="fa fa-user"></i></div><div class="bubble text-abu"><i class="fa fa-circle-o-notch fa-spin"></i> Sedang mengetik...</div>`;
            document.getElementById('areaPesan').appendChild(menunggu);
            document.getElementById('areaPesan').scrollTop = document.getElementById('areaPesan').scrollHeight;

            try {
                const hasil = await panggilAI(teks, gambarList.length > 0 ? gambarList[0] : null);
                menunggu.remove();
                const idBalas = tambahPesan(hasil.jawaban, "ai");
                conversationHistory.push({role:"assistant", content:hasil.jawaban, id:idBalas});
            } catch (err) {
                menunggu.remove();
                tambahPesan("😔 Maaf, ada gangguan. Coba lagi sebentar ya.", "ai");
            } finally {
                sedangMemproses = false;
                btnKirim.disabled = false;
                btnKirim.style.opacity = "1";
            }
        }

        btnKirim.addEventListener("click", kirimPesan);

        inputPesan.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                kirimPesan();
            }
        });

        document.getElementById('btnLanjut').addEventListener('click', async () => {
            inputPesan.value = "**melanjutkan pembicaraan**";
            kirimPesan();
        });

        document.getElementById('btnSaran').addEventListener('click', async () => {
            const res = await fetch("/api/saran", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    riwayat: conversationHistory.map(x => ({role:x.role, content:x.content})),
                    pengaturan: pengaturan
                })
            });
            const data = await res.json();
            const wadah = document.getElementById("daftarSaran");
            wadah.innerHTML = "";
            data.saran.forEach(s => {
                const b = document.createElement("button");
                b.className = "btn-saran";
                b.innerHTML = formatAksi(s);
                b.onclick = () => {
                    inputPesan.value = s;
                    sembunyikanSaran();
                    kirimPesan();
                };
                wadah.appendChild(b);
            });
            document.getElementById("kotakSaran").classList.remove("tersembunyi");
        });
        function sembunyikanSaran() {
            document.getElementById("kotakSaran").classList.add("tersembunyi");
        }

        document.getElementById('btnGambar').addEventListener('click', async () => {
            const pesanTerakhir = conversationHistory.length > 0 ? conversationHistory[conversationHistory.length-1].content : "momen indah";
            const id = tambahPesan("🖼️ Sedang membuat gambar...", "ai");
            const res = await fetch("/api/gambar", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({deskripsi: pesanTerakhir, pengaturan: pengaturan})
            });
            const data = await res.json();
            const el = document.querySelector(`.pesan.ai[data-id="${id}"] .bubble`);
            if (data.url) el.innerHTML = `<img src="${data.url}" class="gambar-hasil" alt="gambar" onclick="bukaPerbesar('${data.url}')" style="cursor:zoom-in;">`;
            else el.innerHTML = "😔 Belum bisa bikin gambar sekarang.";
        });

        document.getElementById('btnAksi').addEventListener('click', () => {
            inputPesan.value = "**";
            inputPesan.focus();
            inputPesan.setSelectionRange(1, 1);
        });

        // ✅ PILIH BANYAK GAMBAR SEKALIGUS
        document.getElementById('btnUnggah').addEventListener('change', async e => {
            const berkasList = Array.from(e.target.files);
            if (berkasList.length === 0) return;

            berkasList.forEach(berkas => {
                if (!berkas.type.startsWith("image/")) {
                    alert("Hanya bisa kirim berkas gambar (.jpg, .png, .webp)!");
                    return;
                }
                const pembaca = new FileReader();
                pembaca.onload = function (hasil) {
                    daftarGambarTerpilih.push(hasil.target.result);
                    perbaruiPreview();
                };
                pembaca.readAsDataURL(berkas);
            });
            e.target.value = "";
            inputPesan.focus();
        });

        document.addEventListener("click", async e => {
            if (e.target.closest(".btn-ulang")) {
                const pesanAi = e.target.closest(".pesan.ai");
                const semua = Array.from(document.querySelectorAll(".pesan"));
                const idx = semua.indexOf(pesanAi);
                conversationHistory = conversationHistory.slice(0, Math.max(0, idx-1));
                pesanAi.remove();

                const pesanTerakhir = conversationHistory.length && conversationHistory.at(-1).role === "user"
                    ? conversationHistory.at(-1).content
                    : "Lanjutkan saja~";

                const menunggu = document.createElement('div');
                menunggu.className = "pesan ai";
                menunggu.innerHTML = `<div class="ikon"><i class="fa fa-user"></i></div><div class="bubble text-abu"><i class="fa fa-circle-o-notch fa-spin"></i> Sedang mengetik ulang...</div>`;
                document.getElementById('areaPesan').appendChild(menunggu);

                const hasil = await panggilAI(pesanTerakhir);
                menunggu.remove();
                const idBaru = tambahPesan(hasil.jawaban, "ai");
                conversationHistory.push({role:"assistant", content:hasil.jawaban, id:idBaru});
            }
        });

        // ✅ BISA DIPANGGIL DARI LUAR
        window.bukaPerbesar = bukaPerbesar;
    </script>
</body>
</html>
